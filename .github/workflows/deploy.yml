name: Deploy Laravel App

on:
  push:
    branches:
      - develop
      - jobalign
      - hallam-city-campus
      - steel-audit
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve deployment target
        id: deploy-target
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME:-develop}"
          case "$branch" in
            jobalign)
              echo "env_file=.env.prod.jobalign" >> "$GITHUB_OUTPUT"
              echo "ftp_server=${{ secrets.FTP_SERVER_JOBALIGN }}" >> "$GITHUB_ENV"
              echo "ftp_username=${{ secrets.FTP_USERNAME_JOBALIGN }}" >> "$GITHUB_ENV"
              echo "ftp_password=${{ secrets.FTP_PASSWORD_JOBALIGN }}" >> "$GITHUB_ENV"
              dir="${{ secrets.FTP_SERVER_DIR_JOBALIGN }}"
              ;;
            hallam-city-campus)
              echo "env_file=.env.prod.hallam-city-campus" >> "$GITHUB_OUTPUT"
              echo "ftp_server=${{ secrets.FTP_SERVER_HALLAM }}" >> "$GITHUB_ENV"
              echo "ftp_username=${{ secrets.FTP_USERNAME_HALLAM }}" >> "$GITHUB_ENV"
              echo "ftp_password=${{ secrets.FTP_PASSWORD_HALLAM }}" >> "$GITHUB_ENV"
              dir="${{ secrets.FTP_SERVER_DIR_HALLAM }}"
              ;;
            steel-audit)
              echo "env_file=.env.prod.steel-audit" >> "$GITHUB_OUTPUT"
              echo "ftp_server=${{ secrets.FTP_SERVER_STEEL }}" >> "$GITHUB_ENV"
              echo "ftp_username=${{ secrets.FTP_USERNAME_STEEL }}" >> "$GITHUB_ENV"
              echo "ftp_password=${{ secrets.FTP_PASSWORD_STEEL }}" >> "$GITHUB_ENV"
              dir="${{ secrets.FTP_SERVER_DIR_STEEL }}"
              ;;
            *)
              echo "env_file=.env.prod" >> "$GITHUB_OUTPUT"
              echo "ftp_server=${{ secrets.FTP_SERVER }}" >> "$GITHUB_ENV"
              echo "ftp_username=${{ secrets.FTP_USERNAME }}" >> "$GITHUB_ENV"
              echo "ftp_password=${{ secrets.FTP_PASSWORD }}" >> "$GITHUB_ENV"
              dir="${{ secrets.FTP_SERVER_DIR }}"
              ;;
          esac

          if [ -z "$dir" ]; then
            dir="/"
          fi

          echo "ftp_server_dir=$dir" >> "$GITHUB_ENV"

      - name: Build assets
        run: npm install && npm run build

      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: 'composer'

      - name: Prepare environment file
        shell: bash
        run: |
          if [ -f "${{ steps.deploy-target.outputs.env_file }}" ]; then
            cp "${{ steps.deploy-target.outputs.env_file }}" .env
          else
            cp .env.prod .env
          fi

      - name: Ensure storage directories exist
        run: |
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs

      - name: Fix storage permissions
        run: |
          sudo chmod -R 777 storage bootstrap/cache || true
          sudo chown -R $(whoami):$(whoami) storage bootstrap/cache || true

      - name: Set permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create storage symlink
        run: |
          ln -s storage/app/public public/storage || true

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          server: ${{ env.ftp_server }}
          username: ${{ env.ftp_username }}
          password: ${{ env.ftp_password }}
          server-dir: ${{ env.ftp_server_dir }}
          exclude: |
            **/resources/js/**
            **/node_modules/**
            **/.git/**
