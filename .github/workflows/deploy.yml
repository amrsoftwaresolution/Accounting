name: Deploy JobAlignBook App Server

on:
  push:
    branches:
      - develop

jobs:
  FTP-Deploy-Action:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2.1.0
      with:
        fetch-depth: 2 
    - name: Build assets
      run: npm install && npm run build

    - name: Install PHP and Composer
      uses: shivammathur/setup-php@v2
      with:
          php-version: '8.2'
          tools: 'composer'

    - name: Copy .env file
      run: php -r "file_exists('.env') || copy('.env.proddemo', '.env');"

    # - name: Install Dependencies
    #   run: composer install --prefer-dist --optimize-autoloader

    # - name: Generate Application Key
    #   run: php artisan key:generate

    - name: Ensure Storage Directories Exist
      run: |
        mkdir -p storage/framework/cache
        mkdir -p storage/framework/sessions
        mkdir -p storage/framework/views
        mkdir -p storage/logs

    - name: Fix Storage Permissions
      run: |
        sudo chmod -R 777 storage bootstrap/cache || true
        sudo chown -R $(whoami):$(whoami) storage bootstrap/cache || true

    - name: Set Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Create Storage Symlink
      run: |
        # rm -f public/storage
        ln -s storage/app/public public/storage

      # - name: Truncate all tables
      #   run: php artisan migrate:fresh

      # - name: Migrate Database
      #   run: php artisan migrate

      # - name: Seed Database
      #   run: php artisan db:seed --class=DatabaseSeeder

      # - name: Clear and Cache Configurations
      #   run: |
      #     php artisan optimize:clear
      #     php artisan cache:clear
      #     php artisan config:clear
      #     php artisan route:clear
      #     php artisan view:clear

    - name: FTP-Deploy-Action
      uses: SamKirkland/FTP-Deploy-Action@4.3.3
      with:
        server: ${{ secrets.FTP_APP_SERVER }}
        username: ${{ secrets.FTP_APP_USERNAME }}
        password: ${{ secrets.FTP_APP_PASSWORD }}
        server-dir: /
        exclude: |
          **/resources/**
          **/node_modules/**
          **/.git/**
