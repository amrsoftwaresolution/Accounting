name: Deploy JBooks App

on:
  push:
    branches:
      - aaass
      - jobalign
      - hallam-city-campus
      - steel-audit
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve deployment target
        id: deploy-target
        shell: bash
        env:
          FTP_SERVER_JOBALIGN: ${{ secrets.FTP_SERVER_JOBALIGN }}
          FTP_USERNAME_JOBALIGN: ${{ secrets.FTP_USERNAME_JOBALIGN }}
          FTP_PASSWORD_JOBALIGN: ${{ secrets.FTP_PASSWORD_JOBALIGN }}
          FTP_SERVER_HALLAM: ${{ secrets.FTP_SERVER_HALLAM }}
          FTP_USERNAME_HALLAM: ${{ secrets.FTP_USERNAME_HALLAM }}
          FTP_PASSWORD_HALLAM: ${{ secrets.FTP_PASSWORD_HALLAM }}
          FTP_SERVER_STEEL: ${{ secrets.FTP_SERVER_STEEL }}
          FTP_USERNAME_STEEL: ${{ secrets.FTP_USERNAME_STEEL }}
          FTP_PASSWORD_STEEL: ${{ secrets.FTP_PASSWORD_STEEL }}
          FTP_SERVER_AAASS: ${{ secrets.FTP_SERVER_AAASS }}
          FTP_USERNAME_AAASS: ${{ secrets.FTP_USERNAME_AAASS }}
          FTP_PASSWORD_AAASS: ${{ secrets.FTP_PASSWORD_AAASS }}
        run: |
          # Helper function to write to GITHUB_ENV safely, stripping newlines
          set_env() {
            local key=$1
            local val
            val=$(echo "$2" | tr -d '\n\r')
            echo "$key=$val" >> "$GITHUB_ENV"
          }

          branch="${GITHUB_REF_NAME:-develop}"
          case "$branch" in
            jobalign)
              echo "env_file=env/.env.prod.jobalign" >> "$GITHUB_OUTPUT"
              set_env "ftp_server" "$FTP_SERVER_JOBALIGN"
              set_env "ftp_username" "$FTP_USERNAME_JOBALIGN"
              set_env "ftp_password" "$FTP_PASSWORD_JOBALIGN"
              dir="/public_html/"
              ;;
            hallam-city-campus)
              echo "env_file=env/.env.prod.hallam-city-campus" >> "$GITHUB_OUTPUT"
              set_env "ftp_server" "$FTP_SERVER_HALLAM"
              set_env "ftp_username" "$FTP_USERNAME_HALLAM"
              set_env "ftp_password" "$FTP_PASSWORD_HALLAM"
              dir="/public_html/"
              ;;
            steel-audit)
              echo "env_file=env/.env.prod.steel-audit" >> "$GITHUB_OUTPUT"
              set_env "ftp_server" "$FTP_SERVER_STEEL"
              set_env "ftp_username" "$FTP_USERNAME_STEEL"
              set_env "ftp_password" "$FTP_PASSWORD_STEEL"
              dir="/"
              ;;
            *)
              echo "env_file=env/.env.prod.aaass" >> "$GITHUB_OUTPUT"
              set_env "ftp_server" "$FTP_SERVER_AAASS"
              set_env "ftp_username" "$FTP_USERNAME_AAASS"
              set_env "ftp_password" "$FTP_PASSWORD_AAASS"
              dir="/"
              ;;
          esac

          if [ -z "$dir" ]; then
            dir="/"
          fi

          echo "ftp_server_dir=$dir" >> "$GITHUB_ENV"

      - name: Build assets
        run: npm install && npm run build

      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: 'composer'

      - name: Prepare environment file
        shell: bash
        run: |
          if [ -f "${{ steps.deploy-target.outputs.env_file }}" ]; then
            cp "${{ steps.deploy-target.outputs.env_file }}" .env
          else
            cp env/.env.prod .env
          fi

      - name: Ensure storage directories exist
        run: |
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs

      - name: Fix storage permissions
        run: |
          sudo chmod -R 777 storage bootstrap/cache || true
          sudo chown -R $(whoami):$(whoami) storage bootstrap/cache || true

      - name: Set permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create storage symlink
        run: |
          ln -s storage/app/public public/storage || true

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          server: ${{ env.ftp_server }}
          username: ${{ env.ftp_username }}
          password: ${{ env.ftp_password }}
          server-dir: ${{ env.ftp_server_dir }}
          exclude: |
            **/resources/js/**
            **/node_modules/**
            **/.git/**
